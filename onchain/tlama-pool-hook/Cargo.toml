[package]
name = "tlama-pool-adapter"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
devnet-ids = []
production-ids = []
program-test = [
    "dep:solana-account",
    "dep:solana-instruction",
    "dep:solana-keypair",
    "dep:solana-program-test",
    "dep:solana-pubkey",
    "dep:solana-signer",
    "dep:solana-transaction",
    "dep:tokio",
]
sbf-test = ["program-test"]

[dependencies]
solana-program = "2.2.1"
spl-token = { version = "8.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "8.0.1", features = ["no-entrypoint"] }
spl-transfer-hook-interface = "0.10.0"
spl-tlv-account-resolution = "0.10.0"
solana-account = { version = ">=4.3.1, <4.4", optional = true }
solana-instruction = { version = ">=3.4, <3.5", optional = true }
solana-keypair = { version = "=3.1.2", optional = true }
solana-program-test = { version = "=4.2.2", features = ["agave-unstable-api"], optional = true }
solana-pubkey = { version = ">=4.2, <4.3", optional = true }
solana-signer = { version = "=3.0.1", optional = true }
solana-transaction = { version = ">=4.1.4, <4.2", optional = true }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"], optional = true }

[build-dependencies]
bs58 = "0.5"
solana-pubkey = { version = "=2.2.1", features = ["curve25519"] }

[dev-dependencies]
tlama-transfer-hook = { path = "../tlama-transfer-hook", features = ["no-entrypoint"] }
